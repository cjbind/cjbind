name: Test

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test; empty uses the triggering event ref
        required: false
        type: string
        default: ""
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: "Unit / ${{ matrix.os.friendly }}"
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: ubuntu-22.04
            sys: linux
            arch: x64
            friendly: Linux
          - runner: macos-14
            sys: darwin
            arch: arm64
            friendly: macOS
          - runner: windows-2022
            sys: windows
            arch: x64
            friendly: Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Setup test environment
        uses: ./.github/actions/setup-cjbind
        with:
          static-libclang: "true"
          runner-key: ${{ matrix.os.runner }}
          architecture: ${{ matrix.os.arch }}

      - name: Test tokenizer
        run: cjpm test -m cjbind_token -V

      - name: Test library selection and dependency upgrade failures
        # A requested release ref may predate this regression script. Ordinary
        # push/PR runs must still fail if an expected script is missing.
        if: ${{ !inputs.ref || hashFiles('scripts/test_build_support.py') != '' }}
        run: uv run scripts/test_build_support.py

      - name: Test generator (Unix)
        if: matrix.os.sys != 'windows'
        shell: bash
        run: uv run python scripts/cjpm.py --static test -m cjbind -V

      - name: Test generator (Windows)
        if: matrix.os.sys == 'windows'
        shell: msys2 {0}
        run: uv run python scripts/cjpm.py --static test -m cjbind -V

      - name: Test CLI (Unix)
        if: matrix.os.sys != 'windows'
        shell: bash
        run: uv run python scripts/cjpm.py --static test -m cjbind_cli -V

      - name: Test CLI (Windows)
        if: matrix.os.sys == 'windows'
        shell: msys2 {0}
        run: uv run python scripts/cjpm.py --static test -m cjbind_cli -V

  integration-test:
    name: "Integration / ${{ matrix.os.friendly }}"
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: ubuntu-22.04
            sys: linux
            arch: x64
            friendly: Linux
          - runner: macos-14
            sys: darwin
            arch: arm64
            friendly: macOS
          - runner: windows-2022
            sys: windows
            arch: x64
            friendly: Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Setup test environment
        uses: ./.github/actions/setup-cjbind
        with:
          static-libclang: "true"
          runner-key: ${{ matrix.os.runner }}
          architecture: ${{ matrix.os.arch }}

      - name: Test generated bindings (Unix)
        if: matrix.os.sys != 'windows'
        shell: bash
        run: uv run python scripts/cjpm.py --static test -m cjbind_test -V

      - name: Test generated bindings (Windows)
        if: matrix.os.sys == 'windows'
        shell: msys2 {0}
        run: uv run python scripts/cjpm.py --static test -m cjbind_test -V

      - name: Compile generated bindings
        if: matrix.os.sys == 'linux'
        run: uv run python scripts/compile_generated.py

      - name: Test CLI diagnostics
        if: matrix.os.sys == 'linux'
        run: uv run python scripts/test_cli_diagnostics.py

      - name: Test string constant compilation and values (Unix)
        # Older release refs run the regression scripts present in that tag.
        # Baseline tests above remain required, as do all scripts on push/PR.
        if: ${{ matrix.os.sys != 'windows' && (!inputs.ref || hashFiles('scripts/test_string_codegen.py') != '') }}
        shell: bash
        run: uv run python scripts/test_string_codegen.py

      - name: Test string constant compilation and values (Windows)
        if: ${{ matrix.os.sys == 'windows' && (!inputs.ref || hashFiles('scripts/test_string_codegen.py') != '') }}
        shell: msys2 {0}
        run: uv run python scripts/test_string_codegen.py

      - name: Test precise macro types and values (Unix)
        if: ${{ matrix.os.sys != 'windows' && (!inputs.ref || hashFiles('scripts/test_macro_const_types.py') != '') }}
        shell: bash
        run: uv run python scripts/test_macro_const_types.py

      - name: Test precise macro types and values (Windows)
        if: ${{ matrix.os.sys == 'windows' && (!inputs.ref || hashFiles('scripts/test_macro_const_types.py') != '') }}
        shell: msys2 {0}
        run: uv run python scripts/test_macro_const_types.py

      - name: Test constant values and rejection diagnostics (Unix)
        if: ${{ matrix.os.sys != 'windows' && (!inputs.ref || hashFiles('scripts/test_constant_regressions.py') != '') }}
        shell: bash
        run: uv run python scripts/test_constant_regressions.py --skip-build

      - name: Test constant values and rejection diagnostics (Windows)
        if: ${{ matrix.os.sys == 'windows' && (!inputs.ref || hashFiles('scripts/test_constant_regressions.py') != '') }}
        shell: msys2 {0}
        run: uv run python scripts/test_constant_regressions.py --skip-build

      - name: Test generated C ABI and debug layout checks (Unix)
        if: ${{ matrix.os.sys != 'windows' && (!inputs.ref || hashFiles('scripts/test_codegen_abi_regressions.py') != '') }}
        shell: bash
        run: uv run python scripts/test_codegen_abi_regressions.py

      - name: Test generated C ABI and debug layout checks (Windows)
        if: ${{ matrix.os.sys == 'windows' && (!inputs.ref || hashFiles('scripts/test_codegen_abi_regressions.py') != '') }}
        shell: msys2 {0}
        run: uv run python scripts/test_codegen_abi_regressions.py

      - name: Test bitfield helper values
        if: ${{ !inputs.ref || hashFiles('scripts/test_bitfield_runtime.py') != '' }}
        run: uv run python scripts/test_bitfield_runtime.py

      - name: Test concurrent macro fallback isolation
        if: ${{ !inputs.ref || hashFiles('scripts/test_macro_fallback_concurrency.py') != '' }}
        run: uv run python scripts/test_macro_fallback_concurrency.py

      - name: Test static wrapper output isolation
        if: ${{ !inputs.ref || hashFiles('scripts/test_static_wrapper_paths.py') != '' }}
        run: uv run python scripts/test_static_wrapper_paths.py

      - name: Run C++ lifecycle integration
        if: matrix.os.sys == 'linux'
        run: uv run python scripts/test_cxx_runtime.py
